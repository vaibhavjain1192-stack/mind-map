<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F0F2ED" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Spine" />
<title>Spine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap');

:root{
  --paper:#F0F2ED; --card:#FFF; --ink:#161C1A; --pine:#2C6A57; --pine-deep:#1E4A3D;
  --mark:#F5C518; --mute:#78857F; --line:#D8DED6; --warn:#B4432B;
  --sans:'DM Sans',system-ui,sans-serif; --display:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);
  overflow-x:hidden;overflow-wrap:break-word;-webkit-tap-highlight-color:rgba(44,106,87,.12)}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.page{max-width:680px;margin:0 auto;padding:28px 20px 80px}

.naming{background:var(--card);border:1px solid var(--pine);border-radius:12px;
  padding:16px 18px;margin-bottom:20px}
.namebtns{display:flex;gap:10px;margin-top:12px}
header{display:flex;align-items:baseline;gap:8px;margin-bottom:26px}
.brand{font:700 21px var(--display);letter-spacing:-.02em}
.nib{width:22px;height:3px;background:var(--mark);border-radius:2px}
.spacer{flex:1}

.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.eyebrow.pine{color:var(--pine)}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}

.btn{font:500 13px/1 var(--sans);padding:9px 14px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn:hover{background:rgba(44,106,87,.08)}
.btn.solid{background:var(--pine);color:#fff;border-color:var(--pine)}
.btn.solid:hover{background:var(--pine-deep)}
.btn.quiet{border-color:transparent;color:var(--mute);padding:6px 8px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}

.bartop{display:flex;align-items:center;gap:8px;margin-bottom:18px}

/* home: the topic list */
.tlist{margin-bottom:12px}
.tcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;margin-bottom:9px;font-family:var(--sans);color:var(--ink)}
.tcard:hover{border-color:var(--pine);background:rgba(44,106,87,.03)}
.tbody{flex:1;min-width:0}
.tname{font:700 16px/1.35 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font:400 13px/1.4 var(--sans);color:var(--mute);margin-top:3px}
.flag{color:var(--warn)}
.chev{color:#C3CAC5;font-size:19px;line-height:1;flex-shrink:0}
.tcard:hover .chev{color:var(--pine)}

/* a topic: its points, shut by default */
.plist{margin-bottom:12px}
.prow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:8px;font-family:var(--sans);color:var(--ink)}
.prow:hover{border-color:var(--pine)}
.pq{flex:1;min-width:0;font:500 14.5px/1.45 var(--sans);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:#BFC6C1;font-weight:400}
.dots{font:400 15px/1 var(--mono);color:#C3CAC5;letter-spacing:2px;flex-shrink:0}

.prow.open{display:block;cursor:default;border-color:var(--pine);
  box-shadow:0 0 0 3px rgba(44,106,87,.08);padding:14px 16px 12px}
.prow.open:hover{border-color:var(--pine)}
.prow.open.adding{border-color:var(--mark);box-shadow:0 0 0 3px rgba(245,197,24,.2)}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pcols{display:grid;grid-template-columns:1fr 1.2fr .85fr;gap:16px;align-items:start}
.pfoot{display:flex;gap:10px;align-items:center;margin-top:13px;padding-top:11px;
  border-top:1px solid var(--line)}
.cell{min-width:0}
.cell::before{content:attr(data-l);display:block;font:500 9.5px/1 var(--mono);
  letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}

.idx{font:500 11px/1 var(--mono);color:var(--pine);flex-shrink:0;
  width:23px;height:23px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
.pip{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0}
.pip.good{background:var(--pine)} .pip.bad{background:var(--warn)}
.otag{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--mute)}
.otag.good{color:var(--pine);border-color:rgba(44,106,87,.45)}
.otag.bad{color:var(--warn);border-color:rgba(180,67,43,.45)}
.x{background:none;border:none;color:#C3CAC5;cursor:pointer;font-size:13px;padding:4px;line-height:1.4}
.x:hover{color:var(--warn)}
.addbtn{width:100%;padding:13px;border-style:dashed;color:var(--pine);font-weight:500}

/* the standing brief — marked out from the points by the highlighter edge */
.brief{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--mark);
  border-radius:4px 12px 12px 4px;padding:13px 16px 14px;margin-bottom:20px}
.briefhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brieftext{font:400 14px/1.65 var(--sans);min-height:24px}
.briefshut{width:100%;padding:11px;margin-bottom:20px;border-style:dashed;
  color:var(--mute);font-weight:500;text-align:left}
.briefshut:hover{color:var(--pine)}

.ed{width:100%;border:none;background:transparent;outline:none;color:var(--ink);padding:2px 0;
  font:400 14px/1.55 var(--sans);resize:none;overflow:hidden}
.ed.q{font-weight:700}
.ed.n{font-family:var(--mono);font-size:13px;color:var(--pine)}
.ed::placeholder{color:#BFC6C1}
.ed:focus{background:rgba(245,197,24,.14);border-radius:4px;box-shadow:0 0 0 5px rgba(245,197,24,.14)}

.rq{font:700 15px/1.45 var(--sans)}
.rr{font:400 14px/1.5 var(--sans);color:var(--mute);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:8px}
.rev.done{border-color:rgba(44,106,87,.4)}
.revhead{display:flex;gap:13px;margin-bottom:13px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{font:500 12px var(--sans);padding:8px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--mute)}
.opt:hover{border-color:var(--pine);color:var(--ink)}
.opt.on.good{background:var(--pine);border-color:var(--pine);color:#fff}
.opt.on.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.opt.on.grey{background:var(--mute);border-color:var(--mute);color:#fff}
.opt[disabled]{opacity:.5;cursor:default}

.progress{height:4px;background:var(--line);border-radius:2px;margin:12px 0 4px;overflow:hidden}
.progress-fill{height:100%;background:var(--mark);border-radius:2px;transition:width .3s}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.verdict{font:400 15px/1.6 var(--sans);color:var(--ink);background:rgba(245,197,24,.16);
  border-left:3px solid var(--mark);border-radius:0 8px 8px 0;padding:14px 16px;margin:0}

.tally{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0;padding:14px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:12px}
.tally b{font:700 19px var(--display);display:block}
.tally span{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.newpoint{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px 18px}
.fld{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);outline:none;resize:vertical}
.fld.mono{font-family:var(--mono);font-size:14px}
.fld+.lbl{margin-top:14px}

#bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--pine-deep);
  color:#fff;padding:9px 18px;border-radius:999px;font:500 13px var(--sans);display:none;z-index:9}
#bar.on{display:block} #bar.bad{background:var(--warn)}
.muted{color:var(--mute);text-align:center;padding:40px 0;font-size:14px}
.diag{margin:10px 0 0;padding-left:20px;color:var(--mute);font-size:14px;line-height:1.65}
.diag li{margin-bottom:9px}
.diag code{word-break:break-all;overflow-wrap:anywhere;font:400 12.5px var(--mono);background:rgba(44,106,87,.09);padding:1px 5px;border-radius:4px;color:var(--ink)}
.diag b{color:var(--ink)}
@media (max-width:720px){

  /* ---- rhythm ---------------------------------------------------- */
  .page{padding:18px 15px calc(94px + env(safe-area-inset-bottom))}
  header{margin-bottom:18px;align-items:center}
  .brand{font-size:19px}
  h1{font-size:clamp(21px,6.2vw,27px);line-height:1.18;margin-bottom:2px}
  .hint{font-size:13.5px;line-height:1.55}
  .eyebrow{font-size:10.5px;letter-spacing:.14em}
  .muted{padding:32px 0;font-size:13.5px}

  /* ---- home: topic cards ------------------------------------------ */
  .bartop{margin-bottom:14px}
  .tcard{padding:15px;border-radius:13px;margin-bottom:8px}
  .tname{font-size:15.5px}
  .tmeta{font-size:12.5px}

  /* ---- points: shut rows stay one line tall ----------------------- */
  .brief{padding:13px 14px 14px;margin-bottom:16px}
  .briefhead{margin-bottom:7px}
  .brieftext{font-size:16px;line-height:1.6}
  .briefshut{padding:13px 14px;min-height:46px;margin-bottom:16px;font-size:13.5px}

  .prow{padding:13px 14px;border-radius:13px;gap:10px}
  .pq{font-size:14.5px;-webkit-line-clamp:3}
  .prow.open{padding:14px 15px 12px}
  .phead{margin-bottom:10px}

  /* three columns will not fit; stack them with their labels */
  .pcols{grid-template-columns:1fr;gap:0}
  .cell{padding-top:11px;margin-top:11px;border-top:1px solid var(--line)}
  .cell:first-child{border-top:none;margin-top:0;padding-top:0}
  .cell::before{font-size:9.5px;margin-bottom:7px}

  /* 16px is the threshold below which iOS Safari zooms on focus */
  .ed,.fld{font-size:16px;line-height:1.5}
  .ed.n,.fld.mono{font-size:15px}
  .ed{padding:4px 0;min-height:28px}
  .ed:focus{box-shadow:0 0 0 4px rgba(245,197,24,.14)}

  .pfoot{flex-direction:column;align-items:stretch;gap:8px;margin-top:12px}
  .pfoot .btn{width:100%}
  .addbtn{padding:15px;min-height:52px;border-radius:13px;font-size:14px}

  .addbtn{padding:15px;min-height:52px;border-radius:13px;font-size:14px}

  /* ---- controls: nothing smaller than a fingertip ----------------- */
  .btn{padding:12px 16px;font-size:14px;min-height:44px}
  .btn.quiet{padding:11px 12px;font-size:13px;min-height:44px}
  .modes{display:flex;width:100%;margin-bottom:16px}
  .mbtn{padding:12px 14px;font-size:14px;min-height:46px;flex:1}
  .naming{padding:15px 16px;border-radius:13px}
  .namebtns .btn{flex:1}

  /* ---- review ----------------------------------------------------- */
  .rev{padding:14px 15px;border-radius:13px}
  .revhead{gap:11px;margin-bottom:12px}
  .rq{font-size:14.5px;line-height:1.4}
  .rr{font-size:13.5px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{padding:12px 8px;font-size:12.5px;line-height:1.3;min-height:48px;text-align:center;
    display:flex;align-items:center;justify-content:center;border-radius:11px}
  .box{padding:15px 16px;border-radius:13px}

  /* four stats in a row will not fit; two by two will */
  .tally{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:15px 16px;border-radius:13px}
  .tally b{font-size:21px;margin-bottom:2px}
  .tally span{font-size:9.5px;letter-spacing:.1em;line-height:1.3}
  .verdict{font-size:14px;line-height:1.55;padding:13px 15px}

  .diag{font-size:13px;padding-left:18px}
  .diag code{font-size:11.5px}

  #bar{left:15px;right:15px;transform:none;text-align:center;
    bottom:calc(15px + env(safe-area-inset-bottom));font-size:13.5px;line-height:1.45;
    border-radius:13px;padding:12px 16px}
}

@media (max-width:380px){
  .page{padding-left:12px;padding-right:12px}
  .opts{grid-template-columns:1fr}
  .opt{min-height:44px}
  .tally{grid-template-columns:1fr 1fr;gap:12px 10px}
  h1{font-size:20px}
  .tname{font-size:15px}
  .prow{padding:12px 13px}
}

</style>
</head>
<body>
<div class="page">
  <header>
    <span class="brand">Spine</span><span class="nib"></span>
    <span class="spacer"></span>
    <button class="btn quiet" id="settings">Sheet</button>
  </header>
  <div id="app"></div>
</div>
<div id="bar"></div>

<script>
/* Every point lives in your Google Sheet. The only thing kept in this browser
   is the Sheet's web app URL, so the page knows where to look. */

const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzZlTFLwSXWGpO_vzMx1RgVxietsmxBO9eGnVhaKJMJ27PCvjXKaGmuyv_EoDDGkABLHQ/exec';

const URLKEY = 'spine-sheet-url';
const OUTCOMES = [
  ['',        'Not reviewed yet'],
  ['covered', 'Covered it well'],
  ['missed',  'Missed it'],
  ['muddled', "Couldn't convey it"],
  ['nochance','Never came up'],
];
const GOOD = ['covered'], BAD = ['missed','muddled'];

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let URL_ = localStorage.getItem(URLKEY) || SHEET_URL;
let rows = [];          // straight from the Sheet, never cached
let topic = null;
let busy = false;
let showSetup = false;
let mode = 'prep';      // prep | review
let adding = false;
let expanded = null;    // id of the point currently open
let naming = false;     // inline "name this topic" field is open
let briefs = {};        // topic name -> its standing brief
let briefOpen = true;
let draft = {q:'',r:'',n:''};

/* ------------------------------- transport ------------------------------
 * Everything goes over JSONP — a <script> tag, which is the one request type
 * Apps Script serves reliably from another domain. POST was the problem: its
 * 302 lands on an echo URL that 404s, so the write appeared to hang forever.
 * Reads and writes now use the same path, and every write hands back the full
 * row list in the same reply, so one round trip does the whole job.
 * ---------------------------------------------------------------------- */

const NEEDS_VERSION = 4;

function bar(msg, bad){
  const b = $('#bar'); b.textContent = msg; b.className = 'on'+(bad?' bad':'');
  clearTimeout(bar._t); bar._t = setTimeout(()=>b.className='', bad?8000:2500);
}

let jsonpN = 0;
function jsonp(params){
  return new Promise((resolve, reject)=>{
    const cb = '__spine_cb_' + (++jsonpN);
    const s = document.createElement('script');
    const done = () => { clearTimeout(timer); delete window[cb]; s.remove(); };
    const timer = setTimeout(()=>{ done(); reject(new Error('The Sheet did not answer in time.')); }, 25000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('The script URL did not return anything.')); };

    const q = Object.entries({...params, callback:cb})
      .map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v==null?'':v)).join('&');
    s.src = URL_ + (URL_.includes('?')?'&':'?') + q;
    if(s.src.length > 7500){ done(); reject(new Error('That text is too long to send in one go — shorten it a little.')); return; }
    document.body.appendChild(s);
  });
}

/* Writes return the refreshed rows, so there is nothing to re-read afterwards. */
async function call(params){
  const data = await jsonp(params);
  if(!data || !data.ok) throw new Error((data && data.error) || 'The Sheet returned an error.');
  if(data.rows) rows = data.rows;
  if(data.topics) briefs = Object.fromEntries(data.topics.map(t=>[t.topic, t.brief || '']));
  if(data.v !== NEEDS_VERSION) setTimeout(()=>bar(
    'Your Apps Script is version '+(data.v||1)+'; this page needs '+NEEDS_VERSION+'. Redeploy Code.gs.', true), 300);
  return data;
}

async function pull(){
  if(!URL_) return;
  await call({action:'list'});
}

async function write(params, msg){
  if(busy) return;
  busy = true; render();
  try{ await call(params); bar(msg); }
  catch(e){ bar('Not saved — '+e.message, true); }
  busy = false; render();
}

async function refresh(){
  busy = true; render();
  try{ await pull(); }
  catch(e){ bar('Could not read the Sheet. '+e.message, true); }
  busy = false; render();
}

/* -------------------------------- render --------------------------------
 * Two screens. No topic selected shows the topic list; picking one shows its
 * points. Points are shut by default — the question alone is what you scan.
 * ---------------------------------------------------------------------- */

function render(){
  const app = $('#app');
  if(!URL_ || showSetup) return renderSetup(app);

  const topics = [...new Set([...rows.map(r=>r.topic), ...Object.keys(briefs)].filter(Boolean))];
  if(render._pendingTopic){
    if(topics.includes(render._pendingTopic)) render._pendingTopic = null;
    else topics.push(render._pendingTopic);
  }
  if(topic && !topics.includes(topic)) topic = null;

  if(!topic) return renderHome(app, topics);
  renderTopic(app, rows.filter(r=>r.topic===topic));
}

/* --------------------------------- home ---------------------------------- */

function renderHome(app, topics){
  app.innerHTML = `
    <div class="bartop">
      <div class="eyebrow">${topics.length} topic${topics.length===1?'':'s'}</div>
      <span class="spacer"></span>
      <button class="btn quiet" id="refresh" ${busy?'disabled':''}>${busy?'Syncing…':'Refresh'}</button>
    </div>

    ${naming ? `
      <div class="naming">
        <label class="lbl" for="tname">Name this topic</label>
        <input class="fld" id="tname" type="text" autocomplete="off"
          placeholder="The meeting, or the subject you need to speak to" />
        <div class="namebtns">
          <button class="btn solid" id="startTopic">Start</button>
          <button class="btn quiet" id="cancelTopic">Cancel</button>
        </div>
      </div>` : ''}

    ${topics.length ? `
      <div class="tlist">
        ${topics.map(t=>{
          const pts = rows.filter(r=>r.topic===t);
          const done = pts.filter(r=>r.outcome).length;
          const bad  = pts.filter(r=>BAD.includes(r.outcome)).length;
          return `<button class="tcard" data-t="${esc(t)}">
            <div class="tbody">
              <div class="tname">${esc(t)}</div>
              <div class="tmeta">${pts.length} point${pts.length===1?'':'s'}${
                done ? ` · ${done} reviewed` : ''}${
                bad ? ` · <span class="flag">${bad} to fix</span>` : ''}${
                (briefs[t]||'').trim() ? ' · brief' : ''}</div>
            </div>
            <span class="chev">›</span>
          </button>`;
        }).join('')}
      </div>` : (naming ? '' : `<div class="muted">No topics yet. Start one, then add your points to it.</div>`)}

    ${naming ? '' : `<button class="btn addbtn" id="newTopic">+ New topic</button>`}`;

  $('#refresh').onclick = refresh;
  $$('.tcard',app).forEach(c=>c.onclick=()=>{
    topic = c.dataset.t; mode='prep'; expanded=null; adding=false; render(); window.scrollTo(0,0);
  });
  wireNaming();
}

function wireNaming(){
  if($('#newTopic')) $('#newTopic').onclick = () => { naming = true; render(); setTimeout(()=>$('#tname')?.focus(),0); };
  if($('#cancelTopic')) $('#cancelTopic').onclick = () => { naming = false; render(); };
  if($('#startTopic')){
    const go = () => {
      const name = $('#tname').value.trim();
      if(!name) return bar('Give the topic a name first', true);
      topic = name; render._pendingTopic = name;
      naming = false; mode = 'prep'; adding = true; expanded = null; render();
      setTimeout(()=>$('#nq')?.focus(), 0);
    };
    $('#startTopic').onclick = go;
    $('#tname').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } };
  }
}

/* -------------------------------- a topic -------------------------------- */

function renderTopic(app, mine){
  if(!mine.length) mode = 'prep';

  app.innerHTML = `
    <div class="bartop">
      <button class="btn quiet" id="back">‹ All topics</button>
      <span class="spacer"></span>
      <button class="btn quiet" id="refresh" ${busy?'disabled':''}>${busy?'Syncing…':'Refresh'}</button>
    </div>

    <h1>${esc(topic)}</h1>
    <p class="hint" style="margin-bottom:16px">${mine.length} point${mine.length===1?'':'s'}</p>

    ${briefBlock()}

    ${mine.length ? `<div class="modes">
      <button class="mbtn ${mode==='prep'?'on':''}" data-m="prep">Prepare</button>
      <button class="mbtn ${mode==='review'?'on':''}" data-m="review">Review after</button>
    </div>` : ''}

    ${mode === 'review' ? reviewView(mine) : prepView(mine)}`;

  wireBrief();
  $('#back').onclick = () => { topic = null; expanded = null; adding = false; render(); window.scrollTo(0,0); };
  $('#refresh').onclick = refresh;
  $$('.mbtn',app).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; adding=false; expanded=null; render(); });

  if(mode === 'review') return wireReview(app);
  wirePrep(app);
}

/* -------------------------------- brief ---------------------------------
 * Standing context for the whole topic: how the process works, who owns what,
 * the numbers you would reach for. This is what you reason from when a
 * question arrives that is not on the list.
 * ---------------------------------------------------------------------- */

function briefBlock(){
  const text = briefs[topic] || '';
  if(!briefOpen){
    return `<button class="btn briefshut" id="briefShow">
      ${text ? 'Show the brief' : '+ Add a brief for this topic'}</button>`;
  }
  return `<div class="brief">
    <div class="briefhead">
      <span class="eyebrow pine">Brief</span>
      <span class="spacer"></span>
      <button class="btn quiet" id="briefHide">Hide</button>
    </div>
    <textarea class="ed brieftext" id="brieftext" rows="2"
      data-was="${esc(text)}"
      placeholder="How the process works, who owns what, the background you would need to answer something you did not prepare for.">${esc(text)}</textarea>
  </div>`;
}

function wireBrief(){
  if($('#briefShow')) $('#briefShow').onclick = () => {
    briefOpen = true; render(); setTimeout(()=>$('#brieftext')?.focus(),0);
  };
  if($('#briefHide')) $('#briefHide').onclick = () => { briefOpen = false; render(); };
  const el = $('#brieftext');
  if(!el) return;
  autosize(el);
  el.oninput = () => autosize(el);
  el.onblur = () => {
    const val = el.value.trim();
    if(val === el.dataset.was) return;
    el.dataset.was = val;
    briefs[topic] = val;
    write({action:'brief', topic, value:val}, 'Brief saved');
  };
}

/* --------------------------------- prep ---------------------------------
 * Shut, a point is just its question. Open, the three fields sit side by side
 * on a wide screen and stack on a narrow one, editable where they sit.
 * ---------------------------------------------------------------------- */

function prepView(mine){
  return `
    <div class="plist">
      ${mine.map((r,i)=> r.id===expanded ? openPoint(r,i) : shutPoint(r,i)).join('')}

      ${adding ? `
        <div class="prow open adding">
          <div class="phead"><span class="idx">${mine.length+1}</span>
            <span class="eyebrow pine">New point</span></div>
          <div class="pcols">
            <div class="cell" data-l="Question or topic">
              <textarea class="ed q" id="nq" rows="1" placeholder="What will they ask, or what do you need to raise?">${esc(draft.q)}</textarea></div>
            <div class="cell" data-l="My response">
              <textarea class="ed" id="nr" rows="1" placeholder="What you intend to say">${esc(draft.r)}</textarea></div>
            <div class="cell" data-l="Numbers">
              <textarea class="ed n" id="nn" rows="1" placeholder="Figures, and where from">${esc(draft.n)}</textarea></div>
          </div>
          <div class="pfoot">
            <button class="btn solid" id="savePoint" ${busy?'disabled':''}>${busy?'Saving…':'Save to Sheet'}</button>
            <button class="btn quiet" id="cancelAdd">Done adding</button>
          </div>
        </div>` : ''}
    </div>
    ${adding ? '' : `<button class="btn addbtn" id="addBtn">+ Add ${mine.length?'another ':''}point</button>`}`;
}

function shutPoint(r,i){
  const filled = [r.response && 'response', r.numbers && 'numbers'].filter(Boolean).length;
  return `<button class="prow" data-open="${esc(r.id)}">
    <span class="idx">${i+1}</span>
    <span class="pq">${esc(r.question) || '<span class="empty">No question written</span>'}</span>
    ${r.outcome ? `<span class="pip ${GOOD.includes(r.outcome)?'good':BAD.includes(r.outcome)?'bad':''}" title="${esc(label(r.outcome))}"></span>` : ''}
    ${filled ? `<span class="dots" title="${filled} more field${filled>1?'s':''}">${'·'.repeat(filled)}</span>` : ''}
    <span class="chev">›</span>
  </button>`;
}

function openPoint(r,i){
  return `<div class="prow open">
    <div class="phead"><span class="idx">${i+1}</span>
      ${r.outcome ? `<span class="otag ${GOOD.includes(r.outcome)?'good':BAD.includes(r.outcome)?'bad':''}">${esc(label(r.outcome))}</span>` : ''}
      <span class="spacer"></span>
      <button class="x" data-del="${esc(r.id)}" aria-label="Delete point ${i+1}">✕</button>
    </div>
    <div class="pcols">
      ${cell(r,'question','Question or topic','q')}
      ${cell(r,'response','My response','')}
      ${cell(r,'numbers','Numbers','n')}
    </div>
    <div class="pfoot"><button class="btn quiet" id="closePoint">Close</button></div>
  </div>`;
}

function cell(r, field, lbl, cls){
  return `<div class="cell" data-l="${lbl}">
    <textarea class="ed ${cls}" data-id="${esc(r.id)}" data-field="${field}"
      data-was="${esc(r[field])}" rows="1" placeholder="—">${esc(r[field])}</textarea>
  </div>`;
}

function wirePrep(app){
  $$('[data-open]',app).forEach(el=>el.onclick = () => {
    expanded = el.dataset.open; adding = false; render();
  });
  if($('#closePoint')) $('#closePoint').onclick = () => { expanded = null; render(); };

  $$('.ed[data-id]',app).forEach(el=>{
    autosize(el);
    el.oninput = () => autosize(el);
    el.onblur = () => {
      const val = el.value.trim();
      if(val === el.dataset.was) return;
      el.dataset.was = val;
      write({action:'update', id:el.dataset.id, field:el.dataset.field, value:val}, 'Updated');
    };
  });

  $$('[data-del]',app).forEach(b=>b.onclick = () => {
    if(confirm('Delete this point from the Sheet?')){ expanded = null; write({action:'delete', id:b.dataset.del}, 'Deleted'); }
  });

  if($('#addBtn')) $('#addBtn').onclick = () => { adding = true; expanded = null; render(); setTimeout(()=>$('#nq')?.focus(),0); };
  if($('#cancelAdd')) $('#cancelAdd').onclick = () => { adding = false; draft = {q:'',r:'',n:''}; render(); };

  /* the draft is held in memory so a failed save never loses what you typed */
  ['nq','nr','nn'].forEach((id,i)=>{
    const el = $('#'+id); if(!el) return;
    const k = ['q','r','n'][i];
    autosize(el);
    el.oninput = () => { draft[k] = el.value; autosize(el); };
  });

  if($('#savePoint')) $('#savePoint').onclick = async () => {
    const q = $('#nq').value.trim(), r = $('#nr').value.trim(), n = $('#nn').value.trim();
    if(!q && !r) return bar('Write a question or a response first', true);
    draft = {q,r,n};
    render._pendingTopic = topic;
    const before = rows.length;
    await write({action:'add', topic, question:q, response:r, numbers:n}, 'Saved — the next one is ready');
    if(rows.length > before){
      draft = {q:'',r:'',n:''};   /* stays open, empty, for the next point */
      render(); setTimeout(()=>$('#nq')?.focus(),0);
    }
  };
}

function reviewView(mine){
  const done = mine.filter(r=>r.outcome).length;
  const n = o => mine.filter(r=>r.outcome===o).length;
  const good = n('covered'), missed = n('missed'), muddled = n('muddled'), none = n('nochance');
  const say = verdict(good, missed, muddled, none, done);

  return `
    <div class="box">
      <div class="eyebrow pine">${done} of ${mine.length} reviewed</div>
      <div class="progress"><div class="progress-fill" style="width:${(done/mine.length)*100}%"></div></div>
      <p class="hint" style="margin-bottom:0">Go through these straight after the meeting, while you still
      remember. One tap each.</p>
    </div>

    <div class="plist">
      ${mine.map((r,i)=>`
        <div class="rev ${r.outcome?'done':''}">
          <div class="revhead"><span class="idx">${i+1}</span>
            <div><div class="rq">${esc(r.question)||'—'}</div>
            ${r.response?`<div class="rr">${esc(r.response)}</div>`:''}</div></div>
          <div class="opts">
            ${OUTCOMES.filter(o=>o[0]).map(([v,l])=>`
              <button class="opt ${r.outcome===v?'on '+(GOOD.includes(v)?'good':BAD.includes(v)?'bad':'grey'):''}"
                data-id="${esc(r.id)}" data-v="${v}" ${busy?'disabled':''}>${esc(l)}</button>`).join('')}
          </div>
        </div>`).join('')}
    </div>

    ${done ? `
      <div class="tally">
        <div><b>${good}</b><span>covered</span></div>
        <div><b>${missed}</b><span>missed</span></div>
        <div><b>${muddled}</b><span>muddled</span></div>
        <div><b>${none}</b><span>never came up</span></div>
      </div>
      ${say ? `<p class="verdict">${esc(say)}</p>` : ''}` : ''}`;
}

/* What the pattern is telling you. Missed and muddled need opposite fixes. */
function verdict(good, missed, muddled, none, done){
  if(done < 2) return '';
  if(missed >= 2 && missed > muddled)
    return 'You are losing points you had prepared. That is a length problem, not a memory one — carry fewer points next time, or a shorter form of each.';
  if(muddled >= 2 && muddled > missed)
    return 'You are remembering them but not landing them. That is a wording problem — rewrite those responses shorter and say them out loud once before the next meeting.';
  if(none >= 2 && none >= done/2)
    return 'Much of this never came up. Worth finding out what the meeting is actually about before preparing for the next one.';
  if(good === done)
    return 'Everything covered. Whatever you did preparing this one, do it again.';
  return '';
}

function wireReview(app){
  $$('.opt',app).forEach(b=>b.onclick = () => {
    const row = rows.find(r=>r.id===b.dataset.id);
    const value = (row && row.outcome === b.dataset.v) ? '' : b.dataset.v;  // tap again to clear
    write({action:'update', id:b.dataset.id, field:'outcome', value},
      value ? 'Recorded' : 'Cleared');
  });
}

const label = v => (OUTCOMES.find(o=>o[0]===v)||['',''])[1];
function autosize(el){ el.style.height='auto'; el.style.height = el.scrollHeight+'px'; }

function renderSetup(app){
  const custom = URL_ !== SHEET_URL;
  app.innerHTML = `
    <h1>Which Sheet?</h1>
    <p class="hint" style="margin-bottom:20px">This page is already pointed at your Sheet.
    Change it below only if you want to use a different one — that override is stored in this
    browser and leaves the built-in URL untouched.</p>
    <label class="lbl" for="u">Web app URL ${custom?'<span style="color:var(--pine)">· overridden here</span>':'· built in'}</label>
    <textarea class="fld mono" id="u" rows="3"
      placeholder="https://script.google.com/macros/s/…/exec">${esc(URL_)}</textarea>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn solid" id="connect">Use this Sheet</button>
      ${custom?`<button class="btn" id="reset">Back to the built-in one</button>`:''}
      <button class="btn quiet" id="cancel">Cancel</button>
    </div>
    <p class="hint" style="margin-top:20px"><b>Not loading?</b>
      <a href="${esc(URL_)}?action=list&callback=test" target="_blank" rel="noopener"
         style="color:var(--pine)">Open the endpoint in a new tab</a> and see which of these you get:</p>
    <ul class="diag">
      <li><code>test({"ok":true,"rows":[…]});</code> — the backend is healthy, and this page should work.</li>
      <li><code>{"ok":true,"rows":[…]}</code> with no <code>test(</code> around it — the updated
        <code>Code.gs</code> is not deployed. Paste it in, then
        <b>Deploy → Manage deployments → pencil → Version: New version</b>.</li>
      <li>A Google <b>sign-in page</b> — the deployment's access is not set to Anyone. Same dialog,
        change <b>Who has access</b>.</li>
      <li>An <b>Apps Script error page</b> — run <code>setUpSheet</code> once from the editor and
        finish the authorisation prompt.</li>
    </ul>`;

  $('#connect').onclick = async () => {
    const v = $('#u').value.trim();
    if(!v) return bar('Paste a URL first', true);
    const prev = URL_;
    URL_ = v;
    try{
      await pull();
      if(v === SHEET_URL) localStorage.removeItem(URLKEY);
      else localStorage.setItem(URLKEY, v);
      showSetup = false; bar('Connected'); render();
    }catch(e){
      URL_ = prev;
      bar('Could not reach that URL. Check it is deployed with access set to Anyone.', true);
    }
  };

  if($('#reset')) $('#reset').onclick = () => {
    localStorage.removeItem(URLKEY); URL_ = SHEET_URL; showSetup = false;
    topic = null; render(); refresh();
  };

  $('#cancel').onclick = () => { showSetup = false; render(); };
}

$('#settings').onclick = () => { showSetup = !showSetup; render(); };

render();
if(URL_) refresh();
</script>
</body>
</html>
